name: Daily Vercel rebuild

# Vercel deploys every push itself. This only triggers a fresh production
# build each day so posts with a future pubDate go live on that date.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "VERCEL_DEPLOY_HOOK secret is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$HOOK"
